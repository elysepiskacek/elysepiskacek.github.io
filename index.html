:root{--bg:#F3F6F8;--card:#fff;--ink:#14213D;--muted:#56637A;--line:#D9E1E8;--teal:#13877F;--tealsoft:#D8F0ED;--coral:#F26B5B;--coralsoft:#FDE4E0;

.profile{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:start;padding-bottom:24px}

.btn.main{background:var(--ink);color:#fff}
.btn:hover{transform:translateY(-2px)}
section{padding:52px 0}

.facts{background:var(--tealsoft);border-radius:22px;padding:24px;align-self:start}
.facts h3{margin:0 0 10px;font:700 18px var(--head)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.proj{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.proj:hover{transform:translateY(-4px);border-color:var(--teal)}
.proj:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.thumb{aspect-ratio:16/10;background:#fff;border-bottom:1px solid var(--line);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img,.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pbody{padding:16px 18px 20px}
.pbody h3{margin:0 0 2px;font:700 20px/1.2 var(--head)}
.when{font-size:14px;color:var(--muted);margin:0 0 8px}
.pbody p.s{margin:0 0 12px;font-size:16px;color:var(--ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.award{background:var(--coralsoft);border-color:#F6BDB5}
.hint{font-size:15px;color:var(--muted);margin-top:14px}
.team{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:32px;display:grid;grid-template-columns:1.5fr 1fr;gap:32px}
.team h3{font:700 24px var(--head);margin:0 0 4px}
.team .when{margin-bottom:12px}
.stats{display:grid;gap:14px;align-content:start}
